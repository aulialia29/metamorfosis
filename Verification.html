<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintaks 4: Verifikasi Hasil Analisis</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Comic Sans MS','Chalkboard SE',sans-serif;
        }

        body{
            min-height:100vh;
            background:
            linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5)),
            url('background.jpegss') no-repeat center center fixed;
            background-size:cover;
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        /* NAVIGASI */
        .nav-header{
            width:100%;
            padding:15px 20px;
            display:flex;
            gap:12px;
        }

        .btn-nav{
            padding:10px 18px;
            background:white;
            border-radius:50px;
            text-decoration:none;
            color:#2e7d32;
            font-weight:bold;
            font-size:0.85rem;
            border:2px solid #81c784;
            transition:0.3s;
        }

        .btn-nav:hover{
            background:#e8f5e9;
            transform:translateY(-2px);
        }

        /* CONTENT */
        .content-wrapper{
            flex:1;
            width:95%;
            max-width:850px;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding-bottom:30px;
        }

        .instruction-box{
            background:#e8f5e9;
            padding:18px;
            border-radius:18px;
            border:2px solid #2e7d32;
            margin-bottom:20px;
            text-align:center;
            width:100%;
            box-shadow:0 5px 12px rgba(0,0,0,0.08);
        }

        .instruction-box h2{
            color:#1b5e20;
            margin-bottom:8px;
        }

        .verif-card{
            background:white;
            width:100%;
            border-radius:25px;
            padding:30px;
            box-shadow:0 10px 25px rgba(0,0,0,0.12);
            border:5px solid #ffffff;
        }

        .case-reminder{
            background:#fff3e0;
            padding:15px;
            border-radius:15px;
            font-size:1rem;
            margin-bottom:20px;
            border-left:5px solid #ff9800;
            line-height:1.5;
        }

        .option-btn{
            display:block;
            width:100%;
            padding:15px;
            margin-bottom:12px;
            background:#f1f8e9;
            border:2px solid #a5d6a7;
            border-radius:15px;
            text-align:left;
            cursor:pointer;
            font-size:1rem;
            transition:0.3s;
        }

        .option-btn:hover{
            background:#dcedc8;
            transform:translateX(5px);
        }

        /* FEEDBACK */
        #feedback-area{
            margin-top:20px;
            padding:15px;
            border-radius:15px;
            display:none;
            width:100%;
            text-align:center;
            font-weight:bold;
            line-height:1.6;
        }

        .clue-style{
            background:#fff9c4;
            border:2px solid #fbc02d;
            color:#856404;
        }

        .success-style{
            background:#c8e6c9;
            border:2px solid #2e7d32;
            color:#1b5e20;
        }

        .btn-finish{
            display:none;
            margin-top:20px;
            padding:12px 40px;
            background:linear-gradient(45deg,#ff9800,#ffb74d);
            color:white;
            text-decoration:none;
            border-radius:100px;
            font-weight:bold;
            box-shadow:0 5px 0 #e65100;
            transition:0.3s;
        }

        .btn-finish:hover{
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

    <header class="nav-header">
        <a href="data-processing.html" class="btn-nav">← Cek Data Lagi</a>
        <a href="index.html" class="btn-nav">🏠 Home</a>
    </header>

    <main class="content-wrapper">

        <div class="instruction-box">
            <h2>🦋 Kuis Metamorfosis Kupu-Kupu</h2>
            <p>Jawablah pertanyaan berikut dengan benar!</p>
        </div>

        <div class="verif-card">

            <div class="case-reminder">
                <strong>Kuis Interaktif 🧠</strong>
                <p id="question-text"></p>
            </div>

            <div id="options-container"></div>

            <div id="feedback-area"></div>

            <center>
                <a href="kesimpulan.html"
                   id="next-btn"
                   class="btn-finish">
                   Kesimpulan ➔
                </a>
            </center>

        </div>
    </main>

    <script>

        const quizData = [

            {
                question:"1. Urutan metamorfosis kupu-kupu yang benar adalah...",
                options:[
                    "A. Telur → Ulat → Kepompong → Kupu-kupu",
                    "B. Telur → Kepompong → Ulat → Kupu-kupu",
                    "C. Ulat → Telur → Kepompong → Kupu-kupu"
                ],
                answer:0,
                clue:"Ingat urutan perubahan kupu-kupu dari awal hingga dewasa."
            },

            {
                question:"2. Tahap kedua dalam metamorfosis kupu-kupu adalah...",
                options:[
                    "A. Kupu-kupu",
                    "B. Ulat",
                    "C. Kepompong"
                ],
                answer:1,
                clue:"Tahap ini muncul setelah telur menetas."
            },

            {
                question:"3. Kepompong adalah tahap ketika...",
                options:[
                    "A. Kupu-kupu bertelur",
                    "B. Ulat berubah menjadi kupu-kupu",
                    "C. Telur menetas"
                ],
                answer:1,
                clue:"Tahap ini terjadi sebelum kupu-kupu dewasa keluar."
            },

            {
                question:"4. Kupu-kupu berkembang biak dengan cara...",
                options:[
                    "A. Melahirkan",
                    "B. Membelah diri",
                    "C. Bertelur"
                ],
                answer:2,
                clue:"Kupu-kupu menghasilkan calon anak dalam bentuk telur."
            },

            {
                question:"5. Metamorfosis kupu-kupu termasuk...",
                options:[
                    "A. Metamorfosis sempurna",
                    "B. Metamorfosis tidak sempurna",
                    "C. Tidak mengalami metamorfosis"
                ],
                answer:0,
                clue:"Ada tahap telur, ulat, kepompong, dan dewasa."
            }

        ];

        let currentQuestion = 0;

        const questionText =
            document.getElementById("question-text");

        const optionsContainer =
            document.getElementById("options-container");

        const feedbackArea =
            document.getElementById("feedback-area");

        const nextBtn =
            document.getElementById("next-btn");


        function loadQuestion(){

            feedbackArea.style.display = "none";

            let q = quizData[currentQuestion];

            questionText.innerHTML = q.question;
            optionsContainer.innerHTML = "";

            q.options.forEach((opt,index)=>{

                let btn =
                    document.createElement("button");

                btn.className = "option-btn";
                btn.innerHTML = opt;

                btn.onclick = function(){
                    checkAnswer(index);
                };

                optionsContainer.appendChild(btn);
            });
        }


        function checkAnswer(choice){

            let q = quizData[currentQuestion];
            feedbackArea.style.display = "block";

            if(choice === q.answer){

                feedbackArea.className =
                    "success-style";

                feedbackArea.innerHTML =
                    "✅ Jawaban Benar! Hebat 🎉";

                setTimeout(()=>{

                    currentQuestion++;

                    if(currentQuestion <
                        quizData.length){

                        loadQuestion();

                    }else{

                        questionText.innerHTML =
                            "🎉 Hebat! Kamu sudah menyelesaikan semua kuis metamorfosis kupu-kupu.";

                        optionsContainer.innerHTML = "";

                        feedbackArea.className =
                            "success-style";

                        feedbackArea.innerHTML =
                            "🌟 Semua soal selesai! Klik tombol di bawah untuk lanjut.";

                        nextBtn.style.display =
                            "inline-block";
                    }

                },1200);

            }else{

                feedbackArea.className =
                    "clue-style";

                feedbackArea.innerHTML =
                    "🔍 PETUNJUK:<br><small>"
                    + q.clue +
                    "</small>";
            }
        }

        loadQuestion();

    </script>

</body>
</html>
